<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointer Target Test</title>
<style>
  :root { --bg: #f6f6f4; --fg: #1d1d1f; --muted: #6e6e73; --target: #d9480f; --ok: #2b8a3e; --panel: #ffffff; --line: #d0d0d0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --target: #ff7a45; --ok: #51cf66; --panel: #222226; --line: #3a3a40; }
  }
  :root[data-theme="dark"] { --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --target: #ff7a45; --ok: #51cf66; --panel: #222226; --line: #3a3a40; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Hiragino Sans", sans-serif; overflow: hidden; }
  #arena { position: fixed; inset: 0; }
  .target { position: absolute; border-radius: 50%; background: var(--target); transform: translate(-50%, -50%); }
  #panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line);
           border-radius: 12px; padding: 20px 24px; width: min(560px, calc(100vw - 32px)); box-sizing: border-box; }
  #panel h1 { font-size: 18px; margin: 0 0 8px; }
  #panel p { margin: 6px 0; color: var(--muted); }
  label { display: block; margin: 10px 0 4px; }
  input, button, textarea, select { font: inherit; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  select, input[type=number] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  button { margin-top: 14px; padding: 8px 18px; border-radius: 8px; border: 0; background: var(--fg); color: var(--bg); cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 6px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  textarea { width: 100%; height: 120px; box-sizing: border-box; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: 12px ui-monospace, Menlo, monospace; }
  #hud { position: fixed; left: 12px; bottom: 10px; color: var(--muted); font-size: 13px; pointer-events: none; }
</style>
</head>
<body>
<div id="arena"></div>
<div id="hud"></div>
<div id="panel">
  <h1>クリック精度テスト</h1>
  <p>表示される円を、できるだけ速く正確にクリックしてください。円の外をクリックするとミスとして数えます。</p>
  <p>大きさ3種類 × 各10回、計30回。最初の1回は練習として集計から除きます。</p>
  <p>測り方は logs/targets-YYYYmmdd.md の手順（tools/targets_report.py の先頭）。終わったら「JSON を保存」で結果を書き出します。</p>
  <div class="grid2">
    <div><label for="device">操作</label>
      <select id="device"><option value="aircontroller">AirController</option><option value="trackpad">トラックパッド</option></select></div>
    <div><label for="distance">カメラとの距離（cm）</label><input id="distance" type="number" min="0" step="1" placeholder="例: 60"></div>
  </div>
  <label for="light">明るさ（例: 昼・窓あり・照明オン）</label>
  <input id="light" type="text">
  <label for="note">メモ（任意）</label>
  <input id="note" type="text">
  <button id="start">開始</button>
</div>
<script>
(() => {
  const SIZES = [24, 48, 96];       // 円の直径（px）
  const PER_SIZE = 10;
  const arena = document.getElementById('arena');
  const panel = document.getElementById('panel');
  const hud = document.getElementById('hud');
  let trials = [], idx = 0, tShown = 0, misses = 0, missOff = [], prev = null, cond = '', el = null, meta = null, runNo = 0;
  // 壁時計（ローカル時刻、ミリ秒）。イベントログ（logs/events-*.jsonl の wall）と同じ形で、run の状態（操作範囲・遅延）と突き合わせる
  const pad = (n, w = 2) => String(n).padStart(w, '0');
  function wallIso(d = new Date()) {
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
  }
  const val = (id) => document.getElementById(id).value.trim();

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function place() {
    const s = trials[idx].size, m = 60;
    let x, y, tries = 0;
    do {  // 前の円から、画面の対角線の 20% 以上離す
      x = m + Math.random() * (innerWidth - 2 * m);
      y = m + Math.random() * (innerHeight - 2 * m);
      tries++;
    } while (prev && Math.hypot(x - prev.x, y - prev.y) < 0.2 * Math.hypot(innerWidth, innerHeight) && tries < 50);
    trials[idx].x = x; trials[idx].y = y;
    trials[idx].dist = prev ? Math.hypot(x - prev.x, y - prev.y) : 0;
    if (!el) { el = document.createElement('div'); el.className = 'target'; arena.appendChild(el); }
    el.style.width = el.style.height = s + 'px';
    el.style.left = x + 'px'; el.style.top = y + 'px';
    tShown = performance.now(); misses = 0; missOff = [];
    hud.textContent = `${cond}  ${idx + 1} / ${trials.length}`;
  }

  function start() {
    const device = val('device');
    cond = device === 'trackpad' ? 'トラックパッド' : 'AirController';
    runNo++;
    meta = { format: 'aircontroller-targets', version: 1, device, run_in_page: runNo,
             distance_cm: val('distance') === '' ? null : Number(val('distance')), light: val('light'), note: val('note'),
             start: wallIso(), user_agent: navigator.userAgent,
             window: [innerWidth, innerHeight], screen: [screen.width, screen.height], dpr: devicePixelRatio,
             fullscreen: !!document.fullscreenElement || (innerWidth === screen.width && innerHeight === screen.height),
             sizes: SIZES, per_size: PER_SIZE };
    trials = [{ size: 48, practice: true }].concat(shuffle(SIZES.flatMap(s => Array(PER_SIZE).fill(0).map(() => ({ size: s })))));
    idx = 0; prev = null; panel.style.display = 'none';
    place();
  }

  arena.addEventListener('mousedown', ev => {
    if (!trials.length || idx >= trials.length) return;
    const t = trials[idx];
    const hit = Math.hypot(ev.clientX - t.x, ev.clientY - t.y) <= t.size / 2;
    if (!hit) {  // 外れた距離（円の縁から、px）も残す
      misses++; missOff.push(Math.round(Math.hypot(ev.clientX - t.x, ev.clientY - t.y) - t.size / 2)); return;
    }
    t.time = performance.now() - tShown; t.misses = misses; t.miss_px = missOff; t.wall = wallIso();
    prev = { x: t.x, y: t.y }; idx++;
    if (idx < trials.length) place(); else finish();
  });

  function finish() {
    if (el) { el.remove(); el = null; }
    hud.textContent = '';
    const done = trials.filter(t => !t.practice);
    const rows = SIZES.map(s => {
      const ts = done.filter(t => t.size === s);
      const times = ts.map(t => t.time).sort((a, b) => a - b);
      const med = times[Math.floor(times.length / 2)];
      const miss = ts.reduce((a, t) => a + t.misses, 0);
      // Fitts の難易度 ID = log2(D/W + 1)、スループット = ID / 時間
      const tp = ts.reduce((a, t) => a + Math.log2(t.dist / t.size + 1) / (Math.max(t.time, 1) / 1000), 0) / ts.length;
      return { s, med, mean: times.reduce((a, b) => a + b, 0) / times.length, miss, n: ts.length, tp };
    });
    const total = done.reduce((a, t) => a + t.time, 0) / 1000;
    const missAll = done.reduce((a, t) => a + t.misses, 0);
    const tpAll = rows.reduce((a, r) => a + r.tp, 0) / rows.length;
    meta.end = wallIso();
    const result = { ...meta, summary: { total_s: +total.toFixed(2), misses: missAll, bits_per_s: +tpAll.toFixed(3),
      by_size: rows.map(r => ({ size: r.s, median_s: +(r.med / 1000).toFixed(3), mean_s: +(r.mean / 1000).toFixed(3), misses: r.miss, bits_per_s: +r.tp.toFixed(3) })) },
      trials: trials.map(t => ({ practice: !!t.practice, size: t.size, x: Math.round(t.x), y: Math.round(t.y), dist: Math.round(t.dist),
        time_ms: Math.round(t.time), misses: t.misses, miss_px: t.miss_px, wall: t.wall })) };
    const fname = `targets-${meta.start.slice(0, 19).replace(/[-:]/g, '').replace('T', '-')}-${meta.device}.json`;
    const csv = ['cond,size,dist,time_ms,misses'].concat(done.map(t => `${cond},${t.size},${t.dist.toFixed(0)},${t.time.toFixed(0)},${t.misses}`)).join('\n');
    const summary = `[${cond}] 合計 ${total.toFixed(1)}s  ミス ${missAll}  スループット ${tpAll.toFixed(2)} bit/s  ` +
      rows.map(r => `${r.s}px: 中央値 ${(r.med / 1000).toFixed(2)}s ミス ${r.miss}`).join('  ');
    panel.innerHTML = `<h1>結果: ${cond}</h1>
      <table><tr><th>直径</th><th>中央値</th><th>平均</th><th>ミス</th><th>bit/s</th></tr>
      ${rows.map(r => `<tr><td>${r.s}px</td><td>${(r.med / 1000).toFixed(2)}s</td><td>${(r.mean / 1000).toFixed(2)}s</td><td>${r.miss}</td><td>${r.tp.toFixed(2)}</td></tr>`).join('')}
      <tr><td>合計</td><td colspan="2">${total.toFixed(1)}s</td><td>${missAll}</td><td>${tpAll.toFixed(2)}</td></tr></table>
      <div class="row"><button id="save">JSON を保存（${fname}）</button><button id="again">もう一度（同じ条件）</button></div>
      <p>保存した JSON は logs/targets/ に移し、tools/targets_report.py でまとめます。下は控え（コピー用）です。</p>
      <textarea readonly>${summary}\n${csv}</textarea>`;
    panel.style.display = 'block';
    document.getElementById('save').onclick = () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(result, null, 1)], { type: 'application/json' }));
      a.download = fname; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    document.getElementById('again').onclick = () => { setupForm(meta); };
  }

  // 「もう一度」: 入力欄を同じ条件で戻す（画面を作り直すので、値を引き継ぐ）
  const form = panel.innerHTML;
  function setupForm(m) {
    panel.innerHTML = form;
    if (m) {
      document.getElementById('device').value = m.device;
      document.getElementById('distance').value = m.distance_cm ?? '';
      document.getElementById('light').value = m.light; document.getElementById('note').value = m.note;
    }
    document.getElementById('start').onclick = start;
  }
  setupForm(null);
})();
</script>
</body>
</html>
